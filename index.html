<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Stats</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #7d8590;
      --green:     #3fb950;
      --green-dim: #1a3d23;
      --red:       #f85149;
      --red-dim:   #3d1a1a;
      --blue:      #58a6ff;
      --yellow:    #d29922;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      padding: 28px 32px 22px;
      border-bottom: 1px solid var(--border);
    }
    header .sub { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    header h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; }
    header .updated { font-size: 0.72rem; color: var(--muted); margin-top: 8px; }

    /* ── MAIN ── */
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── STATS GRID ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .stat-card .lbl {
      font-size: 0.67rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--muted); margin-bottom: 8px;
    }
    .stat-card .val {
      font-size: 1.9rem; font-weight: 800; line-height: 1;
    }
    .stat-card .sub-val {
      font-size: 0.75rem; color: var(--muted); margin-top: 5px;
    }
    .val.green  { color: var(--green); }
    .val.red    { color: var(--red); }
    .val.blue   { color: var(--blue); }
    .val.yellow { color: var(--yellow); }

    /* ── CHARTS ROW ── */
    .charts-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
    }
    .card-title {
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--muted); margin-bottom: 14px;
    }
    .chart-wrap { position: relative; height: 200px; }

    /* ── FORM DOTS ── */
    .form-dots { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 800;
    }
    .dot.w { background: var(--green-dim); color: var(--green); }
    .dot.l { background: var(--red-dim);   color: var(--red); }
    .form-summary { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }

    /* ── RECORD SPLIT ── */
    .split-row {
      display: flex; flex-direction: column; gap: 10px;
    }
    .split-item .split-label {
      font-size: 0.7rem; color: var(--muted); margin-bottom: 4px;
      display: flex; justify-content: space-between;
    }
    .split-bar-track {
      background: var(--surface2); border-radius: 4px; height: 7px; overflow: hidden;
    }
    .split-bar-fill {
      height: 100%; border-radius: 4px; background: var(--green);
      transition: width 0.6s ease;
    }
    .split-record {
      font-size: 0.8rem; font-weight: 700; color: var(--text);
    }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th {
      text-align: left; padding: 9px 14px;
      font-size: 0.64rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface2); }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%;
      font-size: 0.7rem; font-weight: 800;
    }
    .w-badge { background: var(--green-dim); color: var(--green); }
    .l-badge { background: var(--red-dim);   color: var(--red); }

    .delta { font-weight: 700; font-size: 0.82rem; }
    .delta.pos  { color: var(--green); }
    .delta.neg  { color: var(--red); }
    .delta.zero { color: var(--muted); }

    .rival-name  { font-weight: 600; }
    .rival-lk    { font-size: 0.73rem; color: var(--muted); display: block; }
    .partner-txt { font-size: 0.73rem; color: var(--muted); display: block; }
    .ctx-cell    { font-size: 0.78rem; color: var(--muted); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── STREAK ── */
    .streak-val { display: flex; align-items: baseline; gap: 6px; }
    .streak-val .val { font-size: 2.4rem; }
    .streak-type { font-size: 0.8rem; font-weight: 600; }

    /* ── MSG ── */
    .msg { text-align: center; padding: 36px; color: var(--muted); font-size: 0.9rem; }

    @media (max-width: 1000px) {
      .charts-row { grid-template-columns: 1fr 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .charts-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      header { padding: 20px 16px 16px; }
      main { padding: 14px 12px 48px; }
    }
  </style>
</head>
<body>

<header>
  <div class="sub">tennis.de · Stats</div>
  <h1 id="playerName">Cargando…</h1>
  <div class="updated" id="updatedAt"></div>
</header>

<main>

  <!-- STAT CARDS -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="lbl">LK Actual</div><div class="val blue" id="sLk">—</div></div>
    <div class="stat-card"><div class="lbl">Win Rate</div><div class="val" id="sRate">—</div><div class="sub-val" id="sRecord"></div></div>
    <div class="stat-card"><div class="lbl">ΔLK Total</div><div class="val" id="sDelta">—</div><div class="sub-val" id="sDeltaSub"></div></div>
    <div class="stat-card"><div class="lbl">Racha Actual</div><div class="streak-val"><div class="val" id="sStreak">—</div><div class="streak-type" id="sStreakType"></div></div></div>
    <div class="stat-card"><div class="lbl">Singles</div><div class="val" id="sSinglesRate">—</div><div class="sub-val" id="sSinglesRec"></div></div>
    <div class="stat-card"><div class="lbl">Dobles</div><div class="val" id="sDoublesRate">—</div><div class="sub-val" id="sDoublesRec"></div></div>
    <div class="stat-card"><div class="lbl">Mejor Rival</div><div class="val yellow" id="sBestWin" style="font-size:1.2rem;line-height:1.3"></div><div class="sub-val" id="sBestWinSub"></div></div>
    <div class="stat-card"><div class="lbl">ΔLK Promedio</div><div class="val" id="sAvgDelta">—</div><div class="sub-val">por partido</div></div>
  </div>

  <!-- CHARTS -->
  <div class="charts-row">
    <div class="card">
      <div class="card-title">Evolución de LK</div>
      <div class="chart-wrap"><canvas id="lkChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Victorias / Derrotas</div>
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Últimas 10 · forma</div>
      <div id="formDots" class="form-dots msg">…</div>
      <div id="formSummary" class="form-summary"></div>
      <div style="margin-top:18px">
        <div class="card-title">Singles vs Dobles</div>
        <div id="splitBars" class="split-row"></div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <div class="card-title">Historial de Partidos</div>
    <div class="table-wrap">
      <div id="tableWrap" class="msg">Cargando…</div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
  const PLAYER_ID = 'NU3106825';

  // Máximo 3 decimales en tennis.de — padding fijo para alinear columna
  function fmt(v) {
    return v.toFixed(3).replace('.', ',');
  }

  // ── INIT ─────────────────────────────────────────────────────────────────────
  async function init() {
    const res = await fetch('./data.json');
    if (!res.ok) throw new Error(`No se pudo cargar data.json (${res.status})`);
    const data = await res.json();

    const player  = data.players.find(p => p.id === PLAYER_ID) ?? data.players[0];
    const matches = (player.matches ?? []).slice().sort((a, b) =>
      (b.match_date ?? '').localeCompare(a.match_date ?? '')
    );

    document.getElementById('playerName').textContent = player.name;
    document.getElementById('updatedAt').textContent  =
      'Actualizado: ' + new Date(data.generated_at).toLocaleString('es-AR', {
        day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

    renderStats(matches, player.lk);
    renderLkChart(matches, parseFloat(String(player.lk).replace(',', '.')));
    renderPieChart(matches);
    renderForm(matches);
    renderSplit(matches);
    renderTable(matches);
  }

  // ── STATS ────────────────────────────────────────────────────────────────────
  function renderStats(matches, lkRaw) {
    const total   = matches.length;
    const wins    = matches.filter(m => m.won).length;
    const losses  = total - wins;
    const rate    = total ? Math.round(wins / total * 100) : 0;

    const singles = matches.filter(m => !m.is_doubles);
    const doubles = matches.filter(m =>  m.is_doubles);
    const sWins   = singles.filter(m => m.won).length;
    const dWins   = doubles.filter(m => m.won).length;
    const sRate   = singles.length ? Math.round(sWins / singles.length * 100) : null;
    const dRate   = doubles.length ? Math.round(dWins / doubles.length * 100) : null;

    // Delta total
    const deltas  = matches.map(m => m.lk_change).filter(d => d != null);
    const deltaSum = deltas.reduce((a, b) => a + b, 0);
    const deltaAvg = deltas.length ? deltaSum / deltas.length : null;

    // Racha actual
    let streak = 0, streakType = '';
    if (total) {
      const first = matches[0].won;
      streakType = first ? 'victorias' : 'derrotas';
      for (const m of matches) {
        if (m.won === first) streak++;
        else break;
      }
    }

    // Mejor rival ganado (menor LK rival)
    const wonMatches = matches.filter(m => m.won && m.rivals_lk);
    let bestWinName = '—', bestWinLk = '';
    if (wonMatches.length) {
      const best = wonMatches.reduce((acc, m) => {
        const lk = parseFloat(String(m.rivals_lk).split('/')[0].trim().replace(',', '.'));
        return lk < acc.lk ? { m, lk } : acc;
      }, { m: null, lk: Infinity });
      if (best.m) {
        bestWinName = best.m.rivals.split('/')[0].trim();
        bestWinLk   = `LK ${best.m.rivals_lk}`;
      }
    }

    // LK actual formateado
    const lk = typeof lkRaw === 'number'
      ? lkRaw.toFixed(1).replace('.', ',')
      : String(lkRaw ?? '—');

    document.getElementById('sLk').textContent        = lk;
    document.getElementById('sRate').textContent      = rate + '%';
    document.getElementById('sRate').className        = `val ${rate >= 50 ? 'green' : 'red'}`;
    document.getElementById('sRecord').textContent    = `${wins}G – ${losses}P de ${total}`;

    const dSign = deltaSum > 0 ? '+' : '';
    document.getElementById('sDelta').textContent     = deltaSum
      ? dSign + fmt(deltaSum)
      : '—';
    document.getElementById('sDelta').className       = `val ${deltaSum < 0 ? 'green' : deltaSum > 0 ? 'red' : ''}`;
    document.getElementById('sDeltaSub').textContent  = `en ${deltas.length} partidos con dato`;

    document.getElementById('sStreak').textContent    = streak || '—';
    document.getElementById('sStreak').className      = `val ${streak > 0 && streakType === 'victorias' ? 'green' : streak > 0 ? 'red' : ''}`;
    document.getElementById('sStreakType').textContent = streak ? streakType : '';

    document.getElementById('sSinglesRate').textContent = sRate != null ? sRate + '%' : '—';
    document.getElementById('sSinglesRate').className   = `val ${sRate >= 50 ? 'green' : 'red'}`;
    document.getElementById('sSinglesRec').textContent  = singles.length ? `${sWins}G – ${singles.length - sWins}P` : 'Sin datos';

    document.getElementById('sDoublesRate').textContent = dRate != null ? dRate + '%' : '—';
    document.getElementById('sDoublesRate').className   = `val ${dRate >= 50 ? 'green' : 'red'}`;
    document.getElementById('sDoublesRec').textContent  = doubles.length ? `${dWins}G – ${doubles.length - dWins}P` : 'Sin datos';

    document.getElementById('sBestWin').textContent    = bestWinName;
    document.getElementById('sBestWinSub').textContent = bestWinLk;

    document.getElementById('sAvgDelta').textContent   = deltaAvg != null
      ? (deltaAvg > 0 ? '+' : '') + fmt(deltaAvg)
      : '—';
    document.getElementById('sAvgDelta').className = `val ${deltaAvg < 0 ? 'green' : deltaAvg > 0 ? 'red' : ''}`;
  }

  // ── LK CHART ─────────────────────────────────────────────────────────────────
  function renderLkChart(matches, currentLk) {
    const points = [...matches]
      .filter(m => m.player_lk != null && m.match_date)
      .reverse()
      .map(m => ({ x: m.match_date, y: m.player_lk }));

    if (currentLk && points.length && points.at(-1).y !== currentLk) {
      points.push({ x: new Date().toISOString().slice(0, 10), y: currentLk });
    }

    new Chart(document.getElementById('lkChart'), {
      type: 'line',
      data: {
        labels: points.map(p => p.x),
        datasets: [{
          data: points.map(p => p.y),
          borderColor: '#3fb950',
          backgroundColor: 'rgba(63,185,80,0.07)',
          pointRadius: 4, pointBackgroundColor: '#3fb950',
          pointHoverRadius: 6, tension: 0.35, fill: true, borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { label: c => ` LK ${c.raw.toFixed(1).replace('.', ',')}` },
            backgroundColor: '#21262d', borderColor: '#30363d', borderWidth: 1,
            titleColor: '#e6edf3', bodyColor: '#e6edf3',
          }
        },
        scales: {
          x: {
            ticks: { maxTicksLimit: 7, font: { size: 10 }, color: '#7d8590' },
            grid: { color: '#21262d' }
          },
          y: {
            reverse: true,
            ticks: { font: { size: 11 }, color: '#7d8590', callback: v => v.toFixed(1).replace('.', ',') },
            grid: { color: '#21262d' }
          }
        }
      }
    });
  }

  // ── PIE CHART ────────────────────────────────────────────────────────────────
  function renderPieChart(matches) {
    const wins   = matches.filter(m => m.won).length;
    const losses = matches.length - wins;
    new Chart(document.getElementById('pieChart'), {
      type: 'doughnut',
      data: {
        labels: ['Ganados', 'Perdidos'],
        datasets: [{
          data: [wins, losses],
          backgroundColor: ['#3fb950', '#f85149'],
          borderColor: ['#1a3d23', '#3d1a1a'],
          borderWidth: 3, hoverOffset: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: { font: { size: 12 }, padding: 14, boxWidth: 12, color: '#e6edf3' }
          },
          tooltip: {
            callbacks: {
              label: c => ` ${c.label}: ${c.raw} (${Math.round(c.raw / matches.length * 100)}%)`
            },
            backgroundColor: '#21262d', borderColor: '#30363d', borderWidth: 1,
            titleColor: '#e6edf3', bodyColor: '#e6edf3',
          }
        }
      }
    });
  }

  // ── FORM DOTS ────────────────────────────────────────────────────────────────
  function renderForm(matches) {
    const last10 = matches.slice(0, 10).reverse();
    const container = document.getElementById('formDots');
    if (!last10.length) { container.textContent = 'Sin datos'; return; }
    container.innerHTML = '';
    last10.forEach(m => {
      const d = document.createElement('div');
      d.className = `dot ${m.won ? 'w' : 'l'}`;
      d.title = `${m.match_date ?? ''} · ${m.rivals ?? ''}`;
      d.textContent = m.won ? 'G' : 'P';
      container.appendChild(d);
    });
    const w10 = last10.filter(m => m.won).length;
    document.getElementById('formSummary').textContent =
      `${w10} victorias en los últimos ${last10.length} partidos`;
  }

  // ── SPLIT BARS ───────────────────────────────────────────────────────────────
  function renderSplit(matches) {
    const container = document.getElementById('splitBars');
    const groups = [
      { label: 'Singles', items: matches.filter(m => !m.is_doubles) },
      { label: 'Dobles',  items: matches.filter(m =>  m.is_doubles) },
    ];
    container.innerHTML = '';
    groups.forEach(g => {
      if (!g.items.length) return;
      const w = g.items.filter(m => m.won).length;
      const l = g.items.length - w;
      const pct = Math.round(w / g.items.length * 100);
      container.innerHTML += `
        <div class="split-item">
          <div class="split-label">
            <span>${g.label} — <span class="split-record">${w}G ${l}P</span></span>
            <span style="color:var(--green)">${pct}%</span>
          </div>
          <div class="split-bar-track">
            <div class="split-bar-fill" style="width:${pct}%"></div>
          </div>
        </div>`;
    });
  }

  // ── TABLE ─────────────────────────────────────────────────────────────────────
  function renderTable(matches) {
    if (!matches.length) {
      document.getElementById('tableWrap').innerHTML = '<div class="msg">No hay partidos.</div>';
      return;
    }

    const rows = matches.map(m => {
      const date   = m.match_date
        ? m.match_date.slice(0, 10).split('-').reverse().join('.')
        : '—';

      const res    = m.won
        ? '<span class="badge w-badge">G</span>'
        : '<span class="badge l-badge">P</span>';

      const rival    = m.rivals ?? '—';
      const rivalLk  = m.rivals_lk
        ? `<span class="rival-lk">LK ${m.rivals_lk}</span>` : '';
      const partner  = m.partner
        ? `<span class="partner-txt">con ${m.partner}${m.partner_lk != null ? ` · LK ${m.partner_lk.toFixed(1).replace('.', ',')}` : ''}</span>`
        : '';

      const myLk   = m.player_lk != null ? m.player_lk.toFixed(1).replace('.', ',') : '—';
      const score  = m.score ?? '—';

      let dCls = 'zero', dTxt = '—';
      if (m.lk_change != null) {
        // En tenis.de LK menor = mejor; delta negativo = mejoraste
        dCls = m.lk_change < 0 ? 'pos' : m.lk_change > 0 ? 'neg' : 'zero';
        dTxt = (m.lk_change > 0 ? '+' : '') + fmt(m.lk_change);
      }

      return `<tr>
        <td style="white-space:nowrap;color:var(--muted)">${date}</td>
        <td>${res}</td>
        <td>
          <span class="rival-name">${rival}</span>
          ${rivalLk}${partner}
        </td>
        <td style="white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums">${score}</td>
        <td style="white-space:nowrap;font-variant-numeric:tabular-nums">${myLk}</td>
        <td><span class="delta ${dCls}">${dTxt}</span></td>
        <td class="ctx-cell" title="${m.context ?? ''}">${m.context ?? '—'}</td>
      </tr>`;
    }).join('');

    document.getElementById('tableWrap').innerHTML = `
      <table>
        <thead><tr>
          <th>Fecha</th>
          <th>Res.</th>
          <th>Rival / Pareja</th>
          <th>Score</th>
          <th>Mi LK</th>
          <th>Δ LK</th>
          <th>Competición</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  init().catch(err => {
    document.getElementById('tableWrap').innerHTML =
      `<div class="msg">Error: ${err.message}</div>`;
    console.error(err);
  });
</script>
</body>
</html>
